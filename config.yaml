# Configuration for cfi-environdata remote sensing extraction
# ============================================================

# Input / output paths
# Built by python/prepare_gsmm_input.py from the GSMM listing exports (see the
# gsmm section at the foot of this file). Was data/input/synthetic_businesses.csv,
# the 200-row synthetic fixture — switch back to it for a dry run.
input_file: "data/input/gsmm_listings.csv"
output_dir: "data/output"

# Required input columns
input_columns:
  id: "business_id"
  lat: "latitude"
  lon: "longitude"
  date: "fieldwork_date"
  city: "city"

# Date format in input file (Python strftime)
date_format: "%Y-%m-%d"

# ---------- Indicator 1: Elevation ----------
elevation:
  dataset: "USGS/SRTMGL1_003"
  band: "elevation"

# ---------- Indicator 2: Extreme Heat Days ----------
heat:
  dataset: "MODIS/061/MOD11A1"
  band: "LST_Day_1km"
  # MODIS LST is stored in Kelvin * 0.02 scale factor
  scale_factor: 0.02
  offset_kelvin_to_celsius: -273.15
  # Trailing window in years before each record's fieldwork_date
  trailing_years: 2
  # Celsius thresholds for day-count indicators
  thresholds_celsius: [40, 45, 50]
  # Also compute mean and max LST over the window
  compute_continuous: true

# ---------- Indicator 3: Flood Vulnerability ----------
flood:
  # HAND (Height Above Nearest Drainage) from MERIT Hydro (Yamazaki et al., 2019)
  hand:
    dataset: "MERIT/Hydro/v1_0_1"
    band: "hnd"
    # Binary threshold: HAND <= this value (metres) = flood-vulnerable
    threshold_m: 5
  # JRC Global Surface Water supplement
  jrc:
    dataset: "JRC/GSW1_4/GlobalSurfaceWater"
    # Bands to extract
    bands: ["max_extent", "recurrence"]
  # Low-elevation coastal zone flag (metres above sea level)
  coastal_threshold_m: 10
  # Cities to apply coastal flag to
  coastal_cities: ["Lagos", "Jakarta"]

# ---------- Indicator 4: Tree Canopy Cover ----------
canopy:
  dataset: "ESA/WorldCover/v200"
  band: "Map"
  # ESA WorldCover class value for "Tree cover"
  tree_class_value: 10
  # Buffer radii in metres around each business point
  buffer_radii_m: [50, 150]
  # Scale for reduction (should match dataset resolution)
  scale_m: 10

# ---------- Indicator 5: Rainfall ----------
rainfall:
  # CHIRPS v3 daily, "sat" variant. Was UCSB-CHG/CHIRPS/DAILY (v2.0 Final).
  # NOT satellite-only: it partitions station-blended PENTADAL CHIRPS-v3 totals
  # into daily amounts using NASA IMERG Late V07. Station data still informs the
  # pentad totals; only the daily disaggregation is satellite-driven.
  # This asset holds 10,439 images starting 1998-01-01 (the catalog page quotes
  # 1981 for the CHIRPS family) — immaterial here, the window is 2 trailing
  # years. Same band and 5566m grid as v2, so no column or scale changes.
  # Both v2 and v3 end 2026-07-31, ~2 weeks before the last fieldwork date;
  # rain_valid_obs records the actual image count per point.
  dataset: "UCSB-CHC/CHIRPS/V3/DAILY_SAT"
  band: "precipitation"
  trailing_years: 2
  # Daily precipitation thresholds (mm) for day-count indicators
  thresholds_mm: [20, 50]
  # CHIRPS native resolution ~5.5km
  scale_m: 5566

# ---------- Indicator 6: Air Quality (Aerosol Optical Depth) ----------
airquality:
  # MODIS MAIAC AOD — 1km daily, available up to near-present
  dataset: "MODIS/061/MCD19A2_GRANULES"
  band: "Optical_Depth_047"
  # Raw values are scaled by 0.001
  scale_factor: 0.001
  trailing_years: 2
  # AOD thresholds: 0.4 = moderate, 0.8 = high, 1.5 = very high
  # These roughly correspond to PM2.5 of ~35, ~70, ~130 µg/m³
  thresholds_aod: [0.4, 0.8, 1.5]
  # --- Per-indicator overrides (this indicator only) ---
  # MCD19A2 is a GRANULE collection, so a request's cost is dominated by the
  # collection reduction and is nearly INDEPENDENT of how many points it
  # carries. Measured on Addis: 10 pts 167s, 200 pts 167s, 1000 pts 280s.
  # So batch as large as will complete — 11 requests instead of 220. Smaller
  # batches are strictly worse here, which is the opposite of the usual advice
  # and the opposite of what gee.batch_size is tuned for.
  batch_size: 1000
  # Typical request runs 170-280s, so the global 300s timeout leaves no
  # headroom. Failures are GEE-side variance, not a payload limit (500 pts
  # failed while 1000 succeeded), so give it room and let the retry handle it.
  getinfo_timeout_sec: 600

# ---------- Indicator 7: Nighttime Lights ----------
nightlights:
  dataset: "NOAA/VIIRS/DNB/MONTHLY_V1/VCMSLCFG"
  band: "avg_rad"
  # Trailing window in months before fieldwork_date
  trailing_months: 12
  # Buffer radius for zonal mean
  buffer_radius_m: 150
  # VIIRS native resolution ~500m
  scale_m: 500

# ---------- Indicator 8: Built-up Surface Fraction ----------
builtup:
  # JRC GHSL Built-up Surface 2020, 10m resolution
  dataset: "JRC/GHSL/P2023A/GHS_BUILT_S/2020"
  band: "built_surface"
  buffer_radii_m: [50, 150]
  scale_m: 10

# ---------- Time-series analysis window ----------
# Heat, rainfall, air quality and nightlights each reduce an image collection
# over a trailing window, then sample the result at each point.
#
# GROUPING IS BY CITY, not by fieldwork_date. Two listings a week apart share
# >99% of a 2-year window, and at MODIS/CHIRPS resolution (1km / 5.5km) the
# per-date precision buys nothing — it just rebuilds the same expensive
# reduction ~10x more often (29 distinct listing dates vs 3 cities).
#
# THE WINDOW IS A FIXED LENGTH ending at analysis_end_date, so every city and
# every indicator covers exactly the same span. This matters because the
# `*_days_gt*` columns are COUNTS: a window that is 4 weeks longer mechanically
# yields a higher count, so variable-length windows silently confound any
# cross-city comparison.
#
# 2026-07-31 is the last date with complete CHIRPS v3 coverage. Fieldwork runs
# to 2026-08-15, so the final ~2 weeks are excluded deliberately: including them
# would give rainfall no data while the other indicators had some.
#
# Set analysis_end_date to null to anchor each city at its own latest fieldwork
# date instead (still equal lengths, but city-specific end dates).
time_window:
  analysis_end_date: "2026-07-31"

# ---------- Indicator 9: Population Density ----------
population:
  # WorldPop Global Project, 100m unconstrained population counts.
  dataset: "WorldPop/GP/100m/pop"
  band: "population"
  # PINNED YEAR. The catalog page's description mentions 2021, but the GEE
  # collection's newest images are 2020 (verified 2026-09-04 by querying
  # aggregate_array("year")). All five study countries have a 2020 image.
  # The extractor warns if a newer year appears, so this stays honest without
  # making the cache silently data-dependent — resolving "latest" at runtime
  # would change values without changing the config fingerprint.
  year: 2020
  # The band is people PER GRID CELL, not a density. The extractor divides by
  # ee.Image.pixelArea() to produce people per km2, which is comparable across
  # latitudes (cells shrink toward the poles).
  buffer_radii_m: [50, 150]
  # Native grid is 0.000833333 deg ~= 92.77m at the equator.
  scale_m: 93

# ---------- Indicator 10: Population Density (Meta HRSL) ----------
# A SECOND, independent population estimate alongside indicator 9 (WorldPop).
# The two disagree substantially — measured on 300 business points at 150m,
# Addis Ababa reads 7,112 people/km2 under WorldPop against 13,714 under HRSL
# — so carrying both makes that measurement uncertainty visible instead of
# burying it in one arbitrary choice. HRSL correlates better with both
# WorldPop (0.82) and GHS-POP (0.73) than those two do with each other (0.53).
hrsl:
  # COMMUNITY CATALOG ASSET, not the official GEE catalog: maintained by the
  # awesome-gee-community-catalog project (gee-community-catalog.org/projects/hrsl),
  # sourced from Meta/CIESIN under CC-BY. A third-party path can move or be
  # re-versioned without notice — if this asset stops resolving, that is why.
  # 237 global COG tiles; one tile covers each study city.
  dataset: "projects/sat-io/open-datasets/hrsl/hrslpop"
  band: "b1"
  # Population totals derive from census projections circa 2015-2020 depending
  # on country. HRSL is HIGHER RESOLUTION than WorldPop, not more recent.
  # Tiles carry a `version` property (1.5.x here), not a year.
  version_note: "v1.5.x general, census vintage ~2015-2020"
  buffer_radii_m: [50, 150]
  # Native grid 0.000277778 deg ~= 30.9m at the equator. At this resolution a
  # 50m buffer covers ~8 cells, so unlike WorldPop's 93m grid the two radii are
  # genuinely independent (WorldPop's correlate at r=0.9987).
  #
  # THIS SCALE MUST MATCH THE NATIVE GRID. The band is a count per cell and the
  # extractor divides by ee.Image.pixelArea(); reducing at any other scale
  # rescales the denominator but not the count. Reducing WorldPop at 30m rather
  # than its native 93m inflates density 9.4x.
  scale_m: 31

# ---------- GEE Processing ----------
gee:
  # Project ID for Earth Engine (set to your GEE cloud project)
  project: "ee-geogrids"
  # Scale in metres for point sampling (unless overridden per indicator)
  default_scale_m: 30
  # Batch size for processing points (to avoid GEE memory limits)
  batch_size: 50

# ---------- Block-Level Pipeline ----------
blocks:
  # Source GeoJSON files: one per country in the blockexplorer repo
  source_dir: "../cfi-map2-blockexplorer2026/data"
  # Local copy directory for block GeoJSONs
  input_dir: "data/input/blocks"
  output_dir: "data/output/blocks"
  # Fixed analysis end date for time-series indicators (heat, rainfall, AOD, nightlights)
  analysis_end_date: "2026-03-01"
  # Country directory → city name mapping
  country_city_map:
    Brazil: "Sao Paulo"
    Ethiopia: "Addis Ababa"
    India: "Delhi"
    Indonesia: "Jakarta"
    Nigeria: "Lagos"
  # GeoJSON property names
  block_id_field: "block_id"
  # Batch size — blocks are simple rectangles so can handle larger batches
  # than the point pipeline. Larger batches = fewer GEE API round-trips.
  batch_size: 100

# ---------- GSMM Listing Ingestion ----------
# Builds data/input/gsmm_listings.csv from the prepared coordinate file that
# cfi-map2r2-data produces. Run `python3 prepare_gsmm_input.py` before run_all.py.
gsmm:
  # SINGLE SOURCE OF TRUTH. cfi-map2r2-data owns every preparation and cleaning
  # step — choosing the authoritative export per country (cleaned GSMM_Analysis
  # over vendor GSMM_Report), de-duplicating on Enterprise ID, parsing the two
  # Date time formats, normalising comma decimals. This pipeline is a pure
  # consumer, so those rules live in one repo instead of being reimplemented
  # here and drifting. (Until 2026-09-04 this script read the raw .xlsx exports
  # directly; see git history if that logic is ever needed again.)
  #
  # The file is git-ignored in BOTH repos: it carries exact business coordinates.
  source_file: "../cfi-map2r2-data/data/processed/gsmm_coords_for_environdata.csv"
  # Columns expected in that file
  columns:
    id: "business_id"
    lat: "latitude"
    lon: "longitude"
    date: "fieldwork_date"
    city: "city"
  # Output, consumed via the top-level input_file setting.
  output_file: "data/input/gsmm_listings.csv"
  # City -> country. The source file's business_id is the BARE GSMM Enterprise
  # ID, which is unique only within a country: 5 ids appear in two cities each
  # (29797, 31959, 68582, 75750, 83548). run_all.py merges every indicator on
  # business_id alone, so the key is rewritten as "<Country>_<Enterprise ID>"
  # and the raw id kept as `enterprise_id` for the country+enterprise_id join
  # back onto enum_data.
  city_country_map:
    Sao Paulo: "Brazil"
    Addis Ababa: "Ethiopia"
    Delhi: "India"
    Jakarta: "Indonesia"
    Lagos: "Nigeria"
  # Restrict the ingest to a subset of cities. null (or absent) = all five.
  # Override per-run with `--cities Delhi,Lagos`.
  # CURRENTLY the three cities whose listing is complete. Delhi and Sao Paulo
  # are in the source file (7,357 and 3,508 businesses) but excluded pending
  # completion; drop this key to null to extract all five.
  include_cities: ["Addis Ababa", "Jakarta", "Lagos"]
