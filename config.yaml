# Configuration for cfi-environdata remote sensing extraction
# ============================================================

# Input / output paths
# Built by python/prepare_gsmm_input.py from the GSMM listing exports (see the
# gsmm section at the foot of this file). Was data/input/synthetic_businesses.csv,
# the 200-row synthetic fixture — switch back to it for a dry run.
input_file: "data/input/gsmm_listings.csv"
output_dir: "data/output"

# Required input columns
input_columns:
  id: "business_id"
  lat: "latitude"
  lon: "longitude"
  date: "fieldwork_date"
  city: "city"

# Date format in input file (Python strftime)
date_format: "%Y-%m-%d"

# ---------- Indicator 1: Elevation ----------
elevation:
  dataset: "USGS/SRTMGL1_003"
  band: "elevation"
  # Terrain slope in degrees, derived from the same DEM via ee.Terrain.slope.
  # A landslide-susceptibility proxy (the survey asks about clim_*_landslide)
  # and a surface-runoff term for flooding. Set false to skip.
  compute_slope: true

# ---------- Indicator 2: Extreme Heat Days ----------
heat:
  # BOTH MODIS SATELLITES, merged. Terra alone until 2026-10-02, which cost
  # coverage and systematically missed the afternoon peak - see the measured
  # figures in lst_collection() in extract_heat.py. Terra overpasses ~10:30 and
  # ~22:30 local, Aqua ~13:30 and ~01:30, and both carry the same bands on the
  # same grid, so merging needs no reconciliation.
  datasets:
    - "MODIS/061/MOD11A1"   # Terra
    - "MODIS/061/MYD11A1"   # Aqua
  band: "LST_Day_1km"
  # MODIS LST is stored in Kelvin * 0.02 scale factor
  scale_factor: 0.02
  offset_kelvin_to_celsius: -273.15
  # Trailing window in years before each record's fieldwork_date
  trailing_years: 2
  # Celsius thresholds. These produce heat_obs_gt*c - counts of OBSERVATIONS
  # above the threshold, not of days: with two satellites both can exceed it on
  # the same date. They were heat_days_gt*c while Terra alone gave one
  # observation per day. Use the derived heat_frac_gt* columns for any
  # cross-city comparison, as before; those are counts over lst_valid_obs and
  # their meaning is unchanged.
  thresholds_celsius: [40, 45, 50]
  # Also compute mean and max LST over the window
  compute_continuous: true
  # Night-time LST from the SAME dataset, different band. Night heat is what
  # drives heat morbidity - no overnight recovery - and speaks to the survey's
  # clim_heat_* items more directly than daytime surface temperature alone.
  # Setting this to null skips the night bands.
  night_band: "LST_Night_1km"
  # "Tropical night" thresholds (C). 20C and 25C are the common heat-health
  # cut-offs for nights offering no physiological recovery.
  night_thresholds_celsius: [20, 25]
  # Cost is dominated by reducing the collection, not by the number of points,
  # and merging Terra with Aqua doubled it to ~1,460 images per window. At the
  # gee.batch_size default of 50 the merged indicator ran at ~1 point/s - a
  # 5-hour pass. Same profile and same fix as rainfall, airquality, no2, wind,
  # windgust, utci and heatstress. Performance-only, so excluded from the
  # fingerprint.
  batch_size: 500
  getinfo_timeout_sec: 900

# ---------- Indicator 3: Flood Vulnerability ----------
flood:
  # HAND (Height Above Nearest Drainage) from MERIT Hydro (Yamazaki et al., 2019)
  hand:
    dataset: "MERIT/Hydro/v1_0_1"
    band: "hnd"
    # Binary threshold: HAND <= this value (metres) = flood-vulnerable
    threshold_m: 5
  # JRC Global Surface Water supplement
  jrc:
    dataset: "JRC/GSW1_4/GlobalSurfaceWater"
    # Bands to extract
    bands: ["max_extent", "recurrence"]
  # Low-elevation coastal zone flag (metres above sea level)
  coastal_threshold_m: 10
  # Cities to apply coastal flag to
  coastal_cities: ["Lagos", "Jakarta"]

# ---------- Indicator 4: Tree Canopy Cover ----------
canopy:
  dataset: "ESA/WorldCover/v200"
  band: "Map"
  # ESA WorldCover class value for "Tree cover"
  tree_class_value: 10
  # Buffer radii in metres around each business point
  buffer_radii_m: [50, 150]
  # Scale for reduction (should match dataset resolution)
  scale_m: 10

# ---------- Indicator 5: Rainfall ----------
rainfall:
  # CHIRPS v3 daily, "sat" variant. Was UCSB-CHG/CHIRPS/DAILY (v2.0 Final).
  # NOT satellite-only: it partitions station-blended PENTADAL CHIRPS-v3 totals
  # into daily amounts using NASA IMERG Late V07. Station data still informs the
  # pentad totals; only the daily disaggregation is satellite-driven.
  # This asset holds 10,439 images starting 1998-01-01 (the catalog page quotes
  # 1981 for the CHIRPS family) — immaterial here, the window is 2 trailing
  # years. Same band and 5566m grid as v2, so no column or scale changes.
  # Both v2 and v3 end 2026-07-31, ~2 weeks before the last fieldwork date;
  # rain_valid_obs records the actual image count per point.
  dataset: "UCSB-CHC/CHIRPS/V3/DAILY_SAT"
  band: "precipitation"
  trailing_years: 2
  # Daily precipitation thresholds (mm) for day-count indicators
  thresholds_mm: [20, 50]
  # DRY-DAY threshold (mm). A day counts as dry when precipitation is BELOW
  # this. 1.0 is the WMO convention for "a day without meaningful rain" and is
  # the defensible default: CHIRPS is an interpolated satellite/gauge blend, so
  # an exact 0.0 is partly an artefact of the interpolation rather than a
  # meteorological statement. The difference is not cosmetic — measured over the
  # 730-day window it REVERSES the city ranking:
  #   exactly 0mm : Lagos 253, Jakarta 122, Addis Ababa 56
  #   below 1mm   : Lagos 437, Addis Ababa 415, Jakarta 243
  # Addis Ababa has 359 days sitting between 0 and 1mm — trace drizzle that the
  # exact-zero count discards. Both measures are extracted; prefer the
  # threshold-based one and see the data dictionary.
  dry_day_threshold_mm: 1.0
  # Longest run of consecutive dry days. Set false to skip.
  #
  # This flag also EXISTS TO BE PART OF THE FINGERPRINT. Cache validity is keyed
  # on config, not on code, so adding a band in the extractor alone does not
  # invalidate anything and the new column silently never appears (it did not,
  # the first time this was added). Any new output column needs a config key
  # like this one, or an explicit --force.
  compute_dry_spell: true
  # rain_max_dry_spell walks all 730 images with ee.ImageCollection.iterate, so
  # a request costs ~5x what the simple counts do while remaining independent of
  # the point count - the same profile as airquality and no2. Measured: 21s for
  # a request regardless of size. Batch large.
  batch_size: 1000
  getinfo_timeout_sec: 600
  # CHIRPS native resolution ~5.5km
  scale_m: 5566

# ---------- Indicator 6: Air Quality (Aerosol Optical Depth) ----------
airquality:
  # MODIS MAIAC AOD — 1km daily, available up to near-present
  dataset: "MODIS/061/MCD19A2_GRANULES"
  band: "Optical_Depth_047"
  # Raw values are scaled by 0.001
  scale_factor: 0.001
  trailing_years: 2
  # AOD thresholds: 0.4 = moderate, 0.8 = high, 1.5 = very high
  # These roughly correspond to PM2.5 of ~35, ~70, ~130 µg/m³
  thresholds_aod: [0.4, 0.8, 1.5]
  # --- Per-indicator overrides (this indicator only) ---
  # MCD19A2 is a GRANULE collection, so a request's cost is dominated by the
  # collection reduction and is nearly INDEPENDENT of how many points it
  # carries. Measured on Addis: 10 pts 167s, 200 pts 167s, 1000 pts 280s.
  # So batch as large as will complete — 11 requests instead of 220. Smaller
  # batches are strictly worse here, which is the opposite of the usual advice
  # and the opposite of what gee.batch_size is tuned for.
  batch_size: 1000
  # Typical request runs 170-280s, so the global 300s timeout leaves no
  # headroom. Failures are GEE-side variance, not a payload limit (500 pts
  # failed while 1000 succeeded), so give it room and let the retry handle it.
  getinfo_timeout_sec: 600

# ---------- Indicator 7: Nighttime Lights ----------
nightlights:
  dataset: "NOAA/VIIRS/DNB/MONTHLY_V1/VCMSLCFG"
  band: "avg_rad"
  # Trailing window in months before fieldwork_date
  trailing_months: 12
  # Buffer radius for zonal mean
  buffer_radius_m: 150
  # VIIRS native resolution ~500m
  scale_m: 500
  # Month-to-month variability of radiance (SD and coefficient of variation)
  # across the 12 monthly composites. A LIGHTING-STABILITY measure - see the
  # data dictionary for why it is only a weak proxy for power outages. Set
  # false to skip.
  compute_variability: true

# ---------- Indicator 8: Built-up Surface Fraction ----------
builtup:
  # JRC GHSL Built-up Surface 2020.
  dataset: "JRC/GHSL/P2023A/GHS_BUILT_S/2020"
  band: "built_surface"
  buffer_radii_m: [50, 150]
  # NATIVE GRID IS 100m, not the 10m this previously claimed. The band holds
  # SQUARE METRES OF BUILT SURFACE PER PIXEL (raw range 0-10,000), so the
  # proportion of ground built is built_surface / native_scale_m^2.
  #
  # CORRECTED 2026-09-05: the extractor divided by 100, which yields a
  # PERCENTAGE (0-100) while the column name and data dictionary both said
  # "fraction / proportion (0-1)". canopy_fraction_* are genuine 0-1
  # proportions, so the two paired indicators sat on scales 100x apart. Values
  # are now true proportions; anything quoting builtup_fraction before this date
  # is 100x too large.
  native_scale_m: 100
  scale_m: 100

# ---------- Indicator 11: Humid Heat Stress (ERA5-Land) ----------
heatstress:
  # Land surface temperature (indicator 2) ignores humidity entirely, which
  # misranks cities for HUMAN heat stress: dry highland Addis Ababa and humid
  # coastal Jakarta are not comparable on LST alone. This adds air temperature
  # and humidity, and a simplified Wet Bulb Globe Temperature.
  dataset: "ECMWF/ERA5_LAND/DAILY_AGGR"
  bands:
    temp: "temperature_2m"
    temp_max: "temperature_2m_max"
    temp_min: "temperature_2m_min"
    dewpoint: "dewpoint_temperature_2m"
  trailing_years: 2
  # sWBGT thresholds (C) from ISO 7243 occupational heat-stress guidance:
  # 28 = high risk for heavy work, 31 = very high, rest breaks advised.
  thresholds_wbgt: [28, 31]
  # TROPICAL NIGHTS (ETCCDI "TR"): nights whose MINIMUM 2m AIR temperature
  # stays above the threshold. 20C is the standard index; 25C ("hot nights")
  # is what discriminates at the top, since Jakarta and Lagos both saturate
  # at 730 of 730 nights on TR20.
  #
  # WHY THIS SITS BESIDE indicator 2's heat_nights_* RATHER THAN REPLACING IT.
  # Those count night LAND SURFACE temperature, a radiative proxy; TR is
  # defined on air temperature, so only these are comparable with published
  # climate work. They also need no observation-count normalisation - ERA5-Land
  # is gap-free, giving all 730 nights in every city, where the LST night
  # counts rest on denominators ranging 163 (Jakarta) to 823 (Delhi). And they
  # REORDER THE TOP TWO: night LST puts Jakarta (0.983) just above Lagos
  # (0.967), while on air temperature both reach 730 TR20 nights and Lagos
  # takes 317 TR25 nights against Jakarta's 78.
  #
  # The 11km grid costs almost nothing here: indicator 2's night-LST columns
  # already have only 0-2% within-city variance despite being 1km, which is
  # why night LST is excluded from the block table. There is no spatial
  # signal to lose.
  thresholds_tropical_night_c: [20, 25]
  # ~11km native grid. This is COARSER THAN A CITY: expect only a handful of
  # distinct values per city, so treat it as a city-level control rather than
  # within-city variation.
  scale_m: 11132
  # Cost is dominated by reducing the 730-image collection, not by the number
  # of points - the same profile as rainfall, airquality, no2, wind, windgust
  # and utci, which all batch at 1000. This indicator was left on the
  # gee.batch_size default of 50 until 2026-10-01 simply because it predates
  # the finding. Measured on indicator 15, which has an identical profile:
  # ~5 points/s at 50 against ~71 at 1000, i.e. 90 minutes down to about 6.
  # Performance-only, so it is excluded from the fingerprint and setting it
  # neither invalidates the cached column nor triggers a recompute.
  batch_size: 1000
  getinfo_timeout_sec: 600

# ---------- Indicator 12: Traffic-related Air Pollution (NO2) ----------
no2:
  # AOD (indicator 6) is column-integrated aerosol. NO2 is specific to
  # combustion - traffic, generators, industry - so it separates street-level
  # sources from regional dust and biomass haze.
  dataset: "COPERNICUS/S5P/OFFL/L3_NO2"
  band: "tropospheric_NO2_column_number_density"
  trailing_years: 2
  # Raw values are mol/m2; scaled to micromol/m2 for readability.
  scale_factor: 1000000.0
  # ~1113m native grid.
  scale_m: 1113
  # Sentinel-5P starts 2018-06-28; a 2-year window from 2026 is well inside it.
  #
  # Like air quality, this collection is large (~10,200 images in a 2-year
  # window over one city) so request cost is dominated by the reduction rather
  # than the point count. See the airquality section for the measurements
  # behind this pattern.
  batch_size: 1000
  getinfo_timeout_sec: 600

# ---------- Indicator 13: Building Density (Google Open Buildings 2.5D) ----------
buildings:
  # builtup_fraction (indicator 8) is the SHARE OF GROUND covered by built
  # surface: it cannot tell one warehouse from forty kiosks at the same
  # coverage. This counts discrete structures and measures their height and
  # typical footprint, which is the distinction that matters for a study of
  # micro and small enterprises.
  dataset: "GOOGLE/Research/open-buildings-temporal/v1"
  # PINNED YEAR. The collection runs 2016-2023 annually; 2023 is the newest and
  # all five cities are fully covered. Pinned rather than resolved at runtime
  # for the same reason as population.year: "latest" would change values
  # without changing the config fingerprint and silently mix vintages.
  year: 2023
  bands:
    count: "building_fractional_count"
    height: "building_height"
    presence: "building_presence"
  buffer_radii_m: [50, 150]
  # Native grid is 0.5m - by far the finest data in this pipeline.
  native_scale_m: 0.5
  # Reduction scale. A 150m buffer holds ~283,000 native pixels, so reducing at
  # 0.5m costs ~10x more than at 2m for an IDENTICAL result: every statistic
  # here is a MEAN, and the count is recovered from the mean analytically
  # (see the extractor), which makes it scale-independent. Measured on 50
  # Lagos points: 18.4s at 0.5m vs 1.8s at 2m.
  scale_m: 2
  # Pixels whose building probability exceeds this count as "building" when
  # averaging height, so building_height_mean is the mean height OF BUILDINGS
  # rather than a height diluted by open ground.
  height_presence_threshold: 0.5

# ---------- Derived composite columns ----------
# Computed after the merge from columns already extracted (pure client-side
# arithmetic), so they need no cache of their own and are recomputed every run.
derived:
  # FLOOD EXPOSURE BY EITHER MECHANISM. hand_flood_vulnerable is fluvial and
  # pluvial (within 5m of nearest drainage); coastal_lowland is storm surge and
  # tidal (a coastal city below 10m). A business can be exposed by one and not
  # the other, so neither alone answers "is this business flood-exposed".
  #
  # IT ONLY CHANGES ANYTHING IN THE TWO COASTAL CITIES, and barely in one of
  # them. coastal_lowland is false by construction outside flood.coastal_cities,
  # so in Addis Ababa, Delhi and Sao Paulo this IS hand_flood_vulnerable.
  # Measured: Lagos 2,687 -> 2,890 of 3,095 (86.8% -> 93.4%), Jakarta
  # 2,777 -> 2,778 of 4,072 (no material change - coastal_lowland there is
  # almost entirely a subset of the HAND flag).
  #
  # CONSEQUENCE: this is a CROSS-CITY exposure definition. The data dictionary
  # already warns hand_flood_vulnerable discriminates poorly inside flat
  # coastal cities; flagging 93% of Lagos makes that worse. To rank businesses
  # WITHIN a city use the continuous hand_m instead of either binary.
  flood_vulnerable_any:
    name: "flood_vulnerable_any"
    components: ["hand_flood_vulnerable", "coastal_lowland"]

  # FIRE-SPREAD SUSCEPTIBILITY, the environmental counterpart to the survey's
  # clim_event_fire / clim_damage_fire / clim_closure_fire items, which had
  # none. Derived arithmetic on the Open Buildings columns, not an extraction.
  #
  # WHY NOT AN ACTUAL FIRE PRODUCT. There is no usable one for urban micro and
  # small enterprises. FIRMS active fire is 1km (one pixel spans ~44 blocks),
  # urban fires are small and brief against 2-4 MODIS overpasses a day, and
  # MCD64A1 burned area is calibrated on vegetation scars and returns nothing
  # in a dense city. The decisive objection is that the misses would be
  # DIFFERENTIAL: the occasional large industrial fire detected, every
  # market-stall fire missed - exactly the businesses studied here. An
  # indicator with that failure mode is worse than none, so this measures
  # structural susceptibility to SPREAD instead of trying to observe events.
  building_spacing:
    count_column: "building_count_150m"
    area_column: "building_mean_area_150m"
    height_column: "building_height_mean_150m"
    buffer_radius_m: 150
    # Emits building_spacing_m (edge-to-edge gap, metres) and
    # building_spacing_ratio (that gap divided by mean building height). LOWER
    # MEANS MORE EXPOSED on both. Measured on the five-city frame: 89% and 75%
    # within-city variance respectively, among the highest of any indicator
    # here, and near-zero correlation with population density (r = -0.02 with
    # hrsl_density_150m), so they carry information the crowding measures do
    # not. Keep BOTH: they rank cities differently, because Sao Paulo is
    # mid-pack on raw gap but the most exposed on the ratio, its buildings
    # being much the tallest.

  heat_exposure_index:
    # WITHIN-CITY heat exposure. Standardising within city is deliberate, not a
    # convenience: a variance decomposition over the extracted data shows the
    # humid-heat and night-heat variables are effectively CITY CONSTANTS
    # (wbgt_days_gt31c 4% within-city variance, lst_night_mean_c ~1%,
    # heat_nights_frac_gt20c 0%). Pooling those into one index would produce a
    # city fixed effect in disguise that ranks cities rather than businesses.
    # For BETWEEN-city hazard use wbgt_days_gt31c directly - it already
    # integrates temperature and humidity and needs no composite.
    #
    # Components are the heat variables with real within-city variance AND a
    # physical mechanism: surface heat load, the built surface generating it,
    # and the canopy mitigating it. Sign is the direction of exposure.
    components:
      lst_mean_c: 1
      lst_max_c: 1
      builtup_fraction_150m: 1
      canopy_fraction_150m: -1
    # Column to standardise within. null would standardise over the pooled
    # sample, which reintroduces the between-city dominance described above.
    standardise_within: "city"

# ---------- Time-series analysis window ----------
# Heat, rainfall, air quality and nightlights each reduce an image collection
# over a trailing window, then sample the result at each point.
#
# GROUPING IS BY CITY, not by fieldwork_date. Two listings a week apart share
# >99% of a 2-year window, and at MODIS/CHIRPS resolution (1km / 5.5km) the
# per-date precision buys nothing — it just rebuilds the same expensive
# reduction ~10x more often (29 distinct listing dates vs 3 cities).
#
# THE WINDOW IS A FIXED LENGTH ending at analysis_end_date, so every city and
# every indicator covers exactly the same span. This matters because the
# `*_days_gt*` columns are COUNTS: a window that is 4 weeks longer mechanically
# yields a higher count, so variable-length windows silently confound any
# cross-city comparison.
#
# 2026-07-31 is the last date with complete CHIRPS v3 coverage. Fieldwork runs
# to 2026-08-15, so the final ~2 weeks are excluded deliberately: including them
# would give rainfall no data while the other indicators had some.
#
# Set analysis_end_date to null to anchor each city at its own latest fieldwork
# date instead (still equal lengths, but city-specific end dates).
time_window:
  analysis_end_date: "2026-07-31"

# ---------- Indicator 9: Population Density ----------
population:
  # WorldPop Global Project, 100m unconstrained population counts.
  dataset: "WorldPop/GP/100m/pop"
  band: "population"
  # PINNED YEAR. The catalog page's description mentions 2021, but the GEE
  # collection's newest images are 2020 (verified 2026-09-04 by querying
  # aggregate_array("year")). All five study countries have a 2020 image.
  # The extractor warns if a newer year appears, so this stays honest without
  # making the cache silently data-dependent — resolving "latest" at runtime
  # would change values without changing the config fingerprint.
  year: 2020
  # The band is people PER GRID CELL, not a density. The extractor divides by
  # ee.Image.pixelArea() to produce people per km2, which is comparable across
  # latitudes (cells shrink toward the poles).
  buffer_radii_m: [50, 150]
  # Native grid is 0.000833333 deg ~= 92.77m at the equator.
  scale_m: 93

# ---------- Indicator 15: Near-surface wind (ERA5-Land) ----------
wind:
  # Counterpart to the survey's clim_event_wind / clim_damage_wind /
  # clim_closure_wind items. Same collection as indicator 11, different bands,
  # so it costs one extra pass over a collection already being read.
  #
  # THIS IS A CITY-LEVEL CONTROL, NOT A WITHIN-CITY MEASURE, and it cannot
  # identify windstorms. Three reasons, all structural:
  #   - ~11km reanalysis grid, coarser than any of these cities.
  #   - NO GUST BAND. Gusts cause the damage the survey asks about; ERA5-Land
  #     carries daily means and per-component daily extremes only, and the
  #     gust field lives in ERA5 single-levels at ~31km, coarser still.
  #   - No urban canopy, so nothing about street-canyon funnelling.
  # Measured on this frame the winds are light: city mean daily-mean speeds
  # 1.3-2.1 m/s, windiest single day anywhere 8.4 m/s. Nothing near a gale.
  dataset: "ECMWF/ERA5_LAND/DAILY_AGGR"
  bands:
    u: "u_component_of_wind_10m"
    v: "v_component_of_wind_10m"
    u_min: "u_component_of_wind_10m_min"
    u_max: "u_component_of_wind_10m_max"
    v_min: "v_component_of_wind_10m_min"
    v_max: "v_component_of_wind_10m_max"
  trailing_years: 2
  # CALIBRATED TO SEPARATE CITIES, NOT TO MARK HAZARD. Conventional damage
  # thresholds (Beaufort 6 strong breeze = 10.8 m/s, gale = 17.2) would return
  # zero for every business in all five cities on a daily-mean field. These
  # were chosen against the observed distribution: p95 of daily-mean speed runs
  # 2.3 (Addis Ababa) to 4.4 (Lagos) m/s. Read them as "windier days", not as
  # storm days. An 8 m/s threshold was tried and REMOVED: it returned 0 days
  # for every business in four cities and exactly 1 day in Sao Paulo, giving
  # 0.0% within-city variance - a constant, not a variable. The finding it
  # encoded (no city gets near a strong breeze on a daily mean) is already
  # carried by wind_max_daily_mean_ms, whose five-city maximum is 8.4 m/s.
  thresholds_ms: [3, 5]
  percentile: 95
  scale_m: 11132
  # Request cost is dominated by reducing the 730-image collection, not by the
  # number of points - the same profile as rainfall, airquality and no2, which
  # all batch at 1000 for this reason. At the gee.batch_size default of 50 this
  # indicator ran at ~5 points/s (90+ min); batching large makes the whole pass
  # a few minutes. Performance-only, so changing it does not invalidate the
  # cached column.
  batch_size: 1000
  getinfo_timeout_sec: 600

# ---------- Indicator 17: UTCI and mean radiant temperature (ERA5-HEAT) ----------
utci:
  # COMPLEMENT TO INDICATOR 11, not a replacement. wbgt_* stays as the
  # continuity measure; UTCI is the preferred one on physics. sWBGT uses
  # temperature and humidity only; UTCI integrates temperature, humidity, WIND
  # and MEAN RADIANT TEMPERATURE - the proper version of a quantity this
  # pipeline otherwise holds as separate crude pieces.
  #
  # WHAT IT MEASURES THAT sWBGT PROVABLY CANNOT, on this frame:
  #   - It separates the two cities sWBGT puts at zero. wbgt_days_gt31c is 0
  #     for BOTH Addis Ababa and Sao Paulo and the registry has to explain
  #     they are at zero for different reasons (dry vs cool). UTCI measures it:
  #     Sao Paulo 180 days >32C and 494 >26C, against Addis Ababa 0 and 314.
  #   - It finds Delhi's extreme tail. On sWBGT, Lagos (421 days) looks worse
  #     than Delhi (223). UTCI agrees Lagos has more VERY STRONG days (403 v
  #     269) but shows Delhi is the ONLY city reaching EXTREME heat stress -
  #     19 days above 46C, peaking at 48.2C.
  #   - Mean radiant temperature is a genuinely new variable (46.7-54.5C here),
  #     the radiant load a street-front trader stands in. sWBGT ignores it.
  #
  # TWO CEILINGS.
  #   RESOLUTION: ~28km, 2.5x coarser than indicator 11's ERA5-Land grid. A
  #   CITY-LEVEL control with no within-city variation. Accepted because the
  #   measure it sits beside is already city-level (0-4% within-city), so no
  #   spatial information is lost - same reasoning as indicator 16.
  #   DEPENDENCY: a THIRD-PARTY asset, not an official GEE catalog entry. With
  #   indicator 10's HRSL this is the second such dependency; if Climate Engine
  #   moves it, this indicator breaks. The extractor fails loudly rather than
  #   writing nulls. Fallback is computing UTCI from ERA5 directly (radiation
  #   fluxes -> MRT, then the published 6th-order polynomial) - feasible but a
  #   lot of error-prone code against a hosted version.
  dataset: "projects/climate-engine-pro/assets/ce-era5-heat"
  # SOURCE IS IN KELVIN. The extractor converts everything to Celsius.
  bands:
    utci_mean: "utci_mean"
    utci_max: "utci_max"
    mrt_max: "mrt_max"
  trailing_years: 2
  # The standard UTCI thermal-stress categories, applied to the DAILY MAXIMUM:
  # 26 moderate, 32 strong, 38 very strong, 46 extreme. Unlike indicator 15's
  # wind thresholds these are published cut-offs, and all four discriminate
  # across these cities.
  thresholds_c: [26, 32, 38, 46]
  # ERA5 single levels, 0.25 degrees.
  scale_m: 27830
  # NO COASTAL FILL NEEDED, unlike indicators 11 and 15: verified 725/725 valid
  # days at the Lagos lagoon and Victoria Island points where ERA5-Land is
  # masked as water. Note the window holds 725 of 730 days - 5 days absent from
  # the collection globally, so the denominator is identical everywhere and no
  # rate normalisation is required.
  batch_size: 1000
  getinfo_timeout_sec: 900

# ---------- Indicator 16: Wind gusts (ERA5 hourly) ----------
windgust:
  # THE DAMAGE-RELEVANT WIND VARIABLE. Indicator 15 measures climatological
  # windiness from daily means; this measures the gusts that actually damage
  # premises, and it is the one that speaks to clim_damage_wind.
  #
  # DIFFERENT COLLECTION FROM INDICATOR 15, ON PURPOSE. ERA5-Land has no gust
  # band; the gust field exists only in ERA5 single levels, which is coarser.
  # The trade is resolution for the right variable:
  #     indicator 15  ERA5-Land ~11km  daily MEAN  climatological windiness
  #     indicator 16  ERA5      ~28km  hourly GUST damage-relevant extremes
  #
  # WHAT IT BUYS. On daily means nothing in this frame exceeds 8.4 m/s, so no
  # real damage threshold could be crossed. Gusts reach Beaufort 6 in four of
  # five cities, gale in Delhi, and 27.3 m/s (Beaufort 10) in Sao Paulo, so the
  # thresholds below are genuine Beaufort cut-offs rather than numbers picked
  # to make a column vary.
  #
  # WHAT IT DOES NOT BUY. At ~28km this is 2.5x COARSER than indicator 15 -
  # about one value per city. Better for CROSS-CITY hazard, useless within a
  # city. Nothing available fixes that: gusts are a boundary-layer quantity no
  # satellite observes over land, scatterometers are ocean-only, and the
  # Global Wind Atlas downscales to 250m but models mean wind, not gusts.
  dataset: "ECMWF/ERA5/HOURLY"
  # Maximum gust in the preceding hour. The alternative band,
  # instantaneous_10m_wind_gust, is a snapshot on the hour and so misses any
  # peak between readings - wrong for an extremes measure.
  band: "wind_gust_since_previous_post_processing_10m"
  trailing_years: 2
  # REAL Beaufort thresholds, unlike indicator 15's: 6 = strong breeze, 7 =
  # near gale, 8 = gale. Measured over one year at city centres these give
  # Sao Paulo 686 / 204 / 72 hours, so all three discriminate.
  thresholds_ms: [10.8, 13.9, 17.2]
  percentiles: [95, 99]
  compute_mean: true
  # ERA5 single levels, 0.25 degrees.
  scale_m: 27830
  # NO COASTAL FILL NEEDED, unlike indicators 11 and 15: ERA5 covers ocean as
  # well as land, so there is no water mask to punch holes in coastal cities.
  #
  # Cost is dominated by reducing the HOURLY collection (17,520 images over the
  # 2-year window), not by the point count, so batch large.
  batch_size: 1000
  getinfo_timeout_sec: 900

# ---------- Indicator 14: Population Density (WorldPop R2025A, 2026) ----------
pop2026:
  # WorldPop Global2 R2025A, 100m CONSTRAINED population counts, year 2026.
  #
  # WHY THIS EXISTS ALONGSIDE INDICATOR 9. They are different products, not a
  # version bump of one:
  #   indicator 9  (pop_density_*)     Global1 2000-2020, UNCONSTRAINED, 2020
  #   indicator 14 (pop2026_density_*) Global2 R2025A,    CONSTRAINED,   2026
  # Global1 disaggregates census counts across all land; Global2 allocates only
  # to cells where the built-settlement model found buildings. Global2 also
  # rebuilt the mastergrid, so the two do not share cell boundaries. Treat them
  # as independent estimates, never as a time series: a 2020->2026 difference
  # would confound real growth with a change of method, constraint and grid.
  #
  # WHY 2026. Fieldwork ran Jul-Sep 2026, so this is the only population layer
  # contemporaneous with the survey; indicator 9 is six years stale. The cost is
  # that 2026 is a PROJECTION - the modelling inputs are the c.2010 and c.2020
  # census rounds, and years beyond them are interpolated and rescaled to UN
  # WPP 2024 national totals, with uncertainty growing with distance from the
  # census. Observed-but-stale vs contemporaneous-but-modelled is a real
  # trade-off; both are extracted so it can be tested rather than assumed.
  #
  # NOT IN GOOGLE EARTH ENGINE. GEE's WorldPop collection is the Global1 series.
  # R2025A is published only as per-country downloads, so this indicator reads
  # local rasters via python/fetch_worldpop.py. It is the only one that does.
  release: "R2025A"
  file_version: 1
  year: 2026
  raster_dir: "data/input/worldpop"
  country_iso3:
    Sao Paulo: "BRA"
    Addis Ababa: "ETH"
    Delhi: "IND"
    Jakarta: "IDN"
    Lagos: "NGA"
  # Same 3 arc-second grid as indicator 9 (~92.77m at the equator), but a
  # DIFFERENT mastergrid - cells do not align between the two releases.
  buffer_radii_m: [50, 150]
  # Cell values are counts PER CELL. Density divides by each cell's true ground
  # area, computed per raster row from the spheroid rather than assumed to be
  # 100x100m. A 3 arc-second cell measures 8,536 m2 at Jakarta (6.2S), 8,531 at
  # Lagos, 8,481 at Addis Ababa, 7,868 at Sao Paulo (23.6S) and 7,539 at Delhi
  # (28.6N) - the extremes are 13% apart, which would bias every cross-city
  # density comparison if a flat 100x100m were assumed.
  # NoData (-99999) means "no built settlement here" on a CONSTRAINED layer:
  # in the Addis Ababa window only 8 cells of 97,000 are exactly 0, the rest of
  # the unpopulated ground is NoData. false = density over POPULATED ground
  # (NoData excluded from numerator and denominator, matching how GEE masks and
  # how indicator 10's HRSL behaves); true = density over ALL ground.
  # MEASURED 2026-09-21: the distinction is immaterial for this study's
  # geometries. 150m business buffers touch 0.00-0.07% NoData cells across the
  # five cities and the two conventions agree to <0.1%, because businesses and
  # the sampling grid both sit on built land. Left at false for consistency
  # with indicator 10; flip it only if the frame ever extends to rural blocks.
  nodata_as_zero: false

# ---------- Indicator 10: Population Density (Meta HRSL) ----------
# A SECOND, independent population estimate alongside indicator 9 (WorldPop).
# The two disagree substantially — measured on 300 business points at 150m,
# Addis Ababa reads 7,112 people/km2 under WorldPop against 13,714 under HRSL
# — so carrying both makes that measurement uncertainty visible instead of
# burying it in one arbitrary choice. HRSL correlates better with both
# WorldPop (0.82) and GHS-POP (0.73) than those two do with each other (0.53).
hrsl:
  # COMMUNITY CATALOG ASSET, not the official GEE catalog: maintained by the
  # awesome-gee-community-catalog project (gee-community-catalog.org/projects/hrsl),
  # sourced from Meta/CIESIN under CC-BY. A third-party path can move or be
  # re-versioned without notice — if this asset stops resolving, that is why.
  # 237 global COG tiles; one tile covers each study city.
  dataset: "projects/sat-io/open-datasets/hrsl/hrslpop"
  band: "b1"
  # Population totals derive from census projections circa 2015-2020 depending
  # on country. HRSL is HIGHER RESOLUTION than WorldPop, not more recent.
  # Tiles carry a `version` property (1.5.x here), not a year.
  version_note: "v1.5.x general, census vintage ~2015-2020"
  buffer_radii_m: [50, 150]
  # Native grid 0.000277778 deg ~= 30.9m at the equator. At this resolution a
  # 50m buffer covers ~8 cells, so unlike WorldPop's 93m grid the two radii are
  # genuinely independent (WorldPop's correlate at r=0.9987).
  #
  # THIS SCALE MUST MATCH THE NATIVE GRID. The band is a count per cell and the
  # extractor divides by ee.Image.pixelArea(); reducing at any other scale
  # rescales the denominator but not the count. Reducing WorldPop at 30m rather
  # than its native 93m inflates density 9.4x.
  scale_m: 31

# ---------- GEE Processing ----------
gee:
  # Project ID for Earth Engine (set to your GEE cloud project)
  project: "ee-geogrids"
  # Scale in metres for point sampling (unless overridden per indicator)
  default_scale_m: 30
  # Batch size for processing points (to avoid GEE memory limits)
  batch_size: 50

# ---------- Block-Level Pipeline ----------
# Zonal statistics over the sampling-grid block polygons, for mapping these
# indicators across a whole city. Run: cd python/blocks && python3 run_all_blocks.py
blocks:
  # Source GeoJSON, one per country, read directly from the blockexplorer repo.
  source_dir: "../cfi-map2-blockexplorer2026/data"
  input_dir: "data/input/blocks"
  output_dir: "data/output/blocks"
  block_id_field: "block_id"
  # Blocks are simple rectangles (~150m, median 22,000 m2), so they batch larger
  # than points.
  batch_size: 100
  country_city_map:
    Brazil: "Sao Paulo"
    Ethiopia: "Addis Ababa"
    India: "Delhi"
    Indonesia: "Jakarta"
    Nigeria: "Lagos"
  # Restrict to a subset of cities; null = all five. Matches gsmm.include_cities.
  include_cities: ["Addis Ababa", "Delhi", "Jakarta", "Lagos", "Sao Paulo"]
  # Only blocks flagged in the sampling design. null/false = the whole grid,
  # which is what a citywide map needs (120,314 blocks for the five cities
  # against 500 with the flag set).
  final_sample_only: false
  #
  # THE ANALYSIS WINDOW IS SHARED WITH THE POINT PIPELINE (time_window above).
  # It used to be a separate blocks.analysis_end_date of 2026-03-01 against the
  # point pipeline's 2026-07-31, which meant block maps and business-level
  # values described DIFFERENT PERIODS and could not be read together.
  #
  # WHICH INDICATORS TO COMPUTE. Deliberately a subset of the 13 run at business
  # level, chosen on native resolution and measured within-city variance,
  # because a block map can only show what varies between blocks. At ~150m
  # blocks a 1km source gives one value per ~44 blocks and an 11km source one
  # per ~5,400 — mapping those shows an upsampled raster, not spatial pattern.
  #
  # Variance shares below are measured at BUSINESS points on the COMPLETE
  # five-city frame (2026-09-14); the three- and four-city figures they replace
  # are in git history.
  #
  # THESE NUMBERS ARE A PROPERTY OF THE CITY SET, NOT OF THE DATA. Each city
  # added so far was extreme on some axis — Delhi denser, hotter and more
  # polluted; Sao Paulo brighter, steeper and taller — which enlarges the
  # BETWEEN-city term and mechanically shrinks the within-city share without
  # anything changing locally. Nightlights fell 82% -> 77% -> 54% across the
  # three frames on exactly that mechanism. Re-measure after any change to the
  # city set; do not quote these across frames. NO INDICATOR HAS CHANGED SIDE,
  # and the three tiers remain cleanly separated (54-94% / 13-19% / 0.4-6%).
  #   kept, fine-grained : canopy 10m (93% within-city variance), slope 30m
  #                        (84%), buildings 0.5m (80%, was 98% — Sao Paulo's
  #                        buildings are far taller than anyone else's; 97%
  #                        when measured over blocks rather than points),
  #                        hand 90m (64%), builtup 10m (59%), hrsl 31m (59%),
  #                        nightlights 500m (54%)
  #   kept, coarse but conceptually necessary:
  #                        lst_max_c 1km (31%, was 19% before Terra+Aqua -
  #                        doubling the observations removed sampling noise
  #                        that was swamping real spatial pattern),
  #                        no2_mean 1.1km (13%) — expect smooth surfaces,
  #                        not block-level detail
  #   dropped            : ERA5 heat stress 11km (0-3% within-city), CHIRPS
  #                        rainfall 5.5km (6%), night LST (2%), most AOD
  #                        (2%), elevation (0.4% — the between-city range
  #                        swamps anything local; slope from the same DEM is 84%)
  #   added 2026-09-21: pop2026, WorldPop R2025A at 100m. Included on the same
  #                     test as the rest — see the coverage note in the block
  #                     data dictionary for its measured within-city variance.
  #                     It is the one block indicator read from a LOCAL RASTER
  #                     rather than a GEE image, so it has no reduction scale.
  indicators: ["terrain", "heat", "flood", "canopy", "builtup",
               "nightlights", "hrsl", "buildings", "no2", "pop2026"]
  # Per-indicator batch overrides. Where request cost is dominated by the
  # COLLECTION REDUCTION rather than the number of blocks, far fewer and much
  # larger requests is strictly faster - the finding that took the point
  # pipeline's AOD from ~21 hours to ~1.5. Measured on 120 blocks in 2 batches:
  # no2 61s and heat 19s, against 2-4s for every raster-only indicator.
  batch_size_overrides:
    no2: 1000
    heat: 500
  getinfo_timeout_overrides:
    no2: 600
    heat: 600

# ---------- Block-Level LONGITUDINAL Pipeline ----------
# The static block table answers "where"; this one answers "when". Same blocks,
# same two-year window, but each indicator computed over successive fixed-length
# periods, so seasonal variation is visible.
#
# Run: cd python/blocks && python3 extract_longitudinal.py
blocks_longitudinal:
  period_days: 45
  output_file: "all_block_indicators_longitudinal.csv"
  # Cap on the zonal-reduction scale. reduceRegions evaluates at the requested
  # scale, so a scale coarser than the ~149m block returns NULL for every block
  # (no pixel centre falls inside). CHIRPS at 5,566m and ERA5-Land at 11,132m
  # both produced entirely empty columns before this cap.
  max_reduce_scale_m: 100
  # ONLY TIME-VARYING INDICATORS. slope, hand, canopy (WorldCover 2021),
  # builtup (GHSL 2020), hrsl and buildings (2023) are single-epoch rasters:
  # computing them per period would emit 16 identical values per block, which is
  # waste that also LOOKS like data. They stay in the static block table.
  #
  # Three of these were dropped from the static block set for low SPATIAL
  # variation and return here precisely because their TEMPORAL variation is
  # large: rainfall (4-13% within-city, but wet/dry seasonality dominates),
  # ERA5 heat stress (0-5% spatially, strongly seasonal) and AOD (measured on a
  # 16-period stack over Lagos blocks: 0.29 to 0.85, a 3x swing peaking in the
  # Harmattan dust season).
  indicators: ["heat", "rainfall", "airquality", "nightlights", "heatstress", "no2"]
  # Cost is per REQUEST and largely independent of block count, so batch large —
  # the same profile as the static pipeline's no2 and heat.
  # Every indicator here batches large: cost is per REQUEST (dominated by the
  # 16-period collection reductions) and near-independent of block count.
  # Measured per request on 45 blocks: aod 28s, heatstress 15s, no2 13s,
  # heat 5s, rainfall 4s, nightlights 4s.
  batch_size_overrides:
    heat: 500
    rainfall: 500
    airquality: 500
    nightlights: 500
    heatstress: 500
    no2: 500
  getinfo_timeout_overrides:
    heat: 600
    rainfall: 600
    airquality: 600
    nightlights: 600
    heatstress: 600
    no2: 600

# ---------- GSMM Listing Ingestion ----------
# Builds data/input/gsmm_listings.csv from the prepared coordinate file that
# cfi-map2r2-data produces. Run `python3 prepare_gsmm_input.py` before run_all.py.
gsmm:
  # SINGLE SOURCE OF TRUTH. cfi-map2r2-data owns every preparation and cleaning
  # step — choosing the authoritative export per country (cleaned GSMM_Analysis
  # over vendor GSMM_Report), de-duplicating on Enterprise ID, parsing the two
  # Date time formats, normalising comma decimals. This pipeline is a pure
  # consumer, so those rules live in one repo instead of being reimplemented
  # here and drifting. (Until 2026-09-04 this script read the raw .xlsx exports
  # directly; see git history if that logic is ever needed again.)
  #
  # The file is git-ignored in BOTH repos: it carries exact business coordinates.
  source_file: "../cfi-map2r2-data/data/processed/gsmm_coords_for_environdata.csv"
  # Columns expected in that file
  columns:
    id: "business_id"
    lat: "latitude"
    lon: "longitude"
    date: "fieldwork_date"
    city: "city"
  # Output, consumed via the top-level input_file setting.
  output_file: "data/input/gsmm_listings.csv"
  # City -> country. The source file's business_id is the BARE GSMM Enterprise
  # ID, which is unique only within a country: 5 ids appear in two cities each
  # (29797, 31959, 68582, 75750, 83548). run_all.py merges every indicator on
  # business_id alone, so the key is rewritten as "<Country>_<Enterprise ID>"
  # and the raw id kept as `enterprise_id` for the country+enterprise_id join
  # back onto enum_data.
  city_country_map:
    Sao Paulo: "Brazil"
    Addis Ababa: "Ethiopia"
    Delhi: "India"
    Jakarta: "Indonesia"
    Lagos: "Nigeria"
  # Restrict the ingest to a subset of cities. null (or absent) = all five.
  # Override per-run with `--cities Delhi,Lagos`.
  # ALL FIVE CITIES, complete as of 2026-09-14. Delhi joined 2026-09-10 with the
  # final India export (GSMM_Analysis_20260910_India.xlsx, 7,805 listings, up
  # from 7,357); Sao Paulo joined 2026-09-14 with the final Brazil export
  # (GSMM_Analysis_20260911_Brazil.xlsx, 5,224 listings, up from 3,508 — a 49%
  # increase, the largest single addition the frame has seen). The list is now
  # equivalent to null; it is kept explicit so that adding a sixth city has to
  # be a deliberate edit rather than a silent consequence.
  include_cities: ["Addis Ababa", "Delhi", "Jakarta", "Lagos", "Sao Paulo"]
